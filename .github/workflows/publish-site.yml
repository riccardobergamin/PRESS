name: Build and publish Quarto site

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install PRESS and vignette dependencies
        run: python -m pip install -e ".[io,vignettes,dev]"

      - name: Verify public API and vignette sources
        run: |
          python scripts/check_environment.py --extras io,vignettes,dev
          python -m pytest -q
          python scripts/rebuild_vignettes.py
          python scripts/check_docs.py

      - name: Set up Quarto
        uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"

      - name: Render website and execute vignette notebooks
        run: |
          quarto render
          python scripts/check_site.py

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
