name: Verify package and portfolio

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package and verification dependencies
        run: python -m pip install -e ".[io,vignettes]"
      - name: Check dependencies
        run: |
          python scripts/check_environment.py --extras io,vignettes
      - name: Check documentation sources
        run: python scripts/check_docs.py --sources-only
      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: "1.10.19"
      - name: Render portfolio
        run: |
          quarto render --no-execute
          python scripts/check_site.py
      - uses: actions/upload-artifact@v4
        with:
          name: portfolio-preview
          path: _site
