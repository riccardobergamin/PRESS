[build-system]
requires = ["setuptools==75.8.0"]
build-backend = "setuptools.build_meta"

[project]
name = "PRESS"
version = "0.1.0"
description = "A physics-informed framework for possession-loss hazard in football"
requires-python = ">=3.10,<3.13"
dependencies = [
  "jax==0.4.35",
  "jaxopt==0.8.3",
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scikit-learn==1.5.2",
  "scipy==1.14.1",
  "matplotlib==3.10.0",
  "mplsoccer==1.4.0",
  "xgboost==2.1.4",
]

[project.optional-dependencies]
vignettes = [
  "ipykernel==6.29.5",
  "ipython==8.32.0",
  "nbformat==5.10.4",
]

[tool.setuptools.packages.find]
include = ["PRESS*"]
