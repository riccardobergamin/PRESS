website:
  title: PRESS
  site-url: https://riccardobergamin.github.io/PRESS/
  repo-url: https://github.com/riccardobergamin/PRESS
  repo-actions:
  - source
  - issue
  navbar:
    left:
    - href: index.qmd
      text: Model and use
    - href: benchmark.qmd
      text: Benchmark
    right:
    - icon: github
      href: https://github.com/riccardobergamin/PRESS
  sidebar:
    style: floating
    contents:
    - section: Model and use
      contents:
      - index.qmd
      - usage.qmd
      - interpretation.qmd
      - api.qmd
      - solvers.qmd
      - roadmap.qmd
      - data.qmd
      - pipeline.qmd
    - section: Workflow and data
      contents:
      - vignettes/00_match_workflow/00_match_workflow.ipynb
      - vignettes/06_possession_and_checkpoint_setup/06_possession_and_checkpoint_setup.ipynb
    - section: Five model components
      contents:
      - text: 1 · Ball-drive risk
        href: vignettes/01_ball_drive_risk/01_ball_drive_risk.ipynb
      - text: 2 · Pass probability
        href: vignettes/02_pass_probability/02_pass_probability.ipynb
      - text: 3 · Pass selection
        href: vignettes/03_transition_model/03_transition_model.ipynb
      - text: 4 · Action selection
        href: vignettes/04_action_selection/04_action_selection.ipynb
      - text: 5 · Residual risk
        href: vignettes/05a_residual_risk/05a_residual_risk.ipynb
    - section: Composed risk and case studies
      contents:
      - vignettes/05_composed_hazard_and_bands/05_composed_hazard_and_bands.ipynb
      - vignettes/07_survival_curve/07_survival_curve.ipynb
      - vignettes/08_possession_typologies/08_possession_typologies.ipynb
      - vignettes/09_league_level_report/09_league_level_report.ipynb
    - section: Evaluation
      contents:
      - text: Benchmark overview
        href: benchmark.qmd
      - text: Ball-drive benchmark
        href: benchmark.html#ball-drive-benchmark
      - text: Pass-risk benchmark
        href: benchmark.html#pass-risk-benchmark
      - text: Pass-selection benchmark
        href: benchmark.html#pass-selection-benchmark
      - text: Action-selection benchmark
        href: benchmark.html#action-selection-benchmark
      - text: Residual-risk benchmark
        href: benchmark.html#residual-risk-benchmark
      - vignettes/05b_composed_risk_benchmark/05b_composed_risk_benchmark.ipynb
    - section: Extras
      contents:
      - vignettes/extras/bcos/10_bcos.ipynb
      - vignettes/extras/expected_threat/11_expected_threat.ipynb
bibliography: references/refs.bib
format:
  html:
    theme: cosmo
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    page-navigation: true
execute:
  enabled: true
  echo: true
  warning: false
  freeze: false
