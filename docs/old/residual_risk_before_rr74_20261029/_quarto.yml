project:
  type: website
  output-dir: _site
  execute-dir: project
  render:
    - index.qmd
    - benchmark.qmd
    - data.qmd
    - pipeline.qmd
    - interpretation.qmd
    - usage.qmd
    - api.qmd
    - solvers.qmd
    - roadmap.qmd
    - vignettes/00_match_workflow/00_match_workflow.ipynb
    - vignettes/01_ball_drive_risk/01_ball_drive_risk.ipynb
    - vignettes/02_pass_probability/02_pass_probability.ipynb
    - vignettes/03_transition_model/03_transition_model.ipynb
    - vignettes/04_action_selection/04_action_selection.ipynb
    - vignettes/05_composed_hazard_and_bands/05_composed_hazard_and_bands.ipynb
    - vignettes/06_possession_and_checkpoint_setup/06_possession_and_checkpoint_setup.ipynb
    - vignettes/07_survival_curve/07_survival_curve.ipynb
    - vignettes/08_possession_typologies/08_possession_typologies.ipynb
    - vignettes/09_league_level_report/09_league_level_report.ipynb
    - vignettes/extras/bcos/10_bcos.ipynb
    - vignettes/extras/expected_threat/11_expected_threat.ipynb
    - vignettes/extras/residual_risk/12_residual_risk.ipynb

website:
  title: "PRESS"
  site-url: https://riccardobergamin.github.io/PRESS/
  repo-url: https://github.com/riccardobergamin/PRESS
  repo-actions: [source, issue]
  navbar:
    left:
      - href: index.qmd
        text: Model and use
      - href: benchmark.qmd
        text: Benchmark
    right:
      - icon: github
        href: https://github.com/riccardobergamin/PRESS
  sidebar:
    style: floating
    contents:
      - section: Model and use
        contents:
          - index.qmd
          - usage.qmd
          - interpretation.qmd
          - api.qmd
          - solvers.qmd
          - roadmap.qmd
          - section: Component vignettes
            contents:
              - vignettes/00_match_workflow/00_match_workflow.ipynb
              - vignettes/01_ball_drive_risk/01_ball_drive_risk.ipynb
              - vignettes/02_pass_probability/02_pass_probability.ipynb
              - vignettes/03_transition_model/03_transition_model.ipynb
              - vignettes/04_action_selection/04_action_selection.ipynb
              - vignettes/05_composed_hazard_and_bands/05_composed_hazard_and_bands.ipynb
              - vignettes/06_possession_and_checkpoint_setup/06_possession_and_checkpoint_setup.ipynb
              - vignettes/07_survival_curve/07_survival_curve.ipynb
              - vignettes/08_possession_typologies/08_possession_typologies.ipynb
              - vignettes/09_league_level_report/09_league_level_report.ipynb
          - data.qmd
          - pipeline.qmd
      - section: Extras
        contents:
          - vignettes/extras/bcos/10_bcos.ipynb
          - vignettes/extras/expected_threat/11_expected_threat.ipynb
          - vignettes/extras/residual_risk/12_residual_risk.ipynb
      - section: Evaluation
        contents:
          - benchmark.qmd

bibliography: references/refs.bib

format:
  html:
    theme: cosmo
    toc: true
    toc-location: right
    code-copy: true
    code-overflow: wrap
    page-navigation: true

execute:
  enabled: true
  echo: true
  warning: false
  freeze: false
